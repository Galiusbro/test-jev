[project]
name = "jev-agent"
version = "0.1.0"
description = "Controlled ticket-to-PR coding agent: LangGraph orchestration, Jev decisions, NVIDIA models."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
jev-agent = "jev_agent.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["demo-api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["demo-api/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=jev_agent --cov-report=term-missing"

